app:
  replicaCount: 1
  image:
    repository: ddt-app
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    DATABASE_URL: "postgresql://ddt:ddt@ddt-postgres:5432/ddt"
    N8N_URL: "http://ddt-n8n:5678"
    MCP_SERVER_URL: "http://ddt-mcp:3001"
    AUTH_SECRET: "dev-secret-change-in-production"
    S3_ENDPOINT: "http://ddt-minio:9000"
    S3_ACCESS_KEY: "minioadmin"
    S3_SECRET_KEY: "minioadmin"

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  port: 5432
  env:
    POSTGRES_DB: ddt
    POSTGRES_USER: ddt
    POSTGRES_PASSWORD: ddt
  storage:
    size: 1Gi

n8n:
  image:
    repository: n8nio/n8n
    tag: latest
  port: 5678
  env:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: ddt-postgres
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: ddt
    DB_POSTGRESDB_PASSWORD: ddt
    N8N_PROTOCOL: http
    N8N_PORT: "5678"

mcp:
  replicaCount: 1
  image:
    repository: ddt-mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  port: 3001

sdlcRunner:
  image:
    repository: ddt-sdlc-pod-runner
    tag: latest

minio:
  image:
    repository: minio/minio
    tag: latest
  port: 9000
  consolePort: 9001
  env:
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
  storage:
    size: 5Gi
