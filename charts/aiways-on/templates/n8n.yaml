{{- if .Values.n8n.enabled }}
# SVC-5 n8n — 공식 이미지를 쓰므로 Dockerfile 이 없다 (UOW-7).
# 워크플로우 A·B·C JSON 은 U3 가 소유하며 n8n 배포 이후에 작성한다 (D-18).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.n8n.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiways-on.labels" (dict "name" .Values.n8n.name "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.n8n.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.n8n.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.n8n.name }}
    spec:
      containers:
        - name: n8n
          image: {{ .Values.n8n.image }}
          ports:
            - containerPort: {{ .Values.n8n.port }}
          env:
            - name: SDLC_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: master-key } }
            - name: PORTAL_URL
              valueFrom: { configMapKeyRef: { name: sdlc-endpoints, key: portalUrl } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.n8n.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.n8n.name }}
  ports:
    - port: {{ .Values.n8n.port }}
      targetPort: {{ .Values.n8n.port }}
{{- end }}
