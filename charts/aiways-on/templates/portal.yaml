apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.portal.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "aiways-on.labels" (dict "name" .Values.portal.name "root" .) | nindent 4 }}
spec:
  # NFR-02 — stateless 이므로 수평 확장한다. Socket Mode 는 여기 두지 않는다 (SVC-4 로 분리).
  replicas: {{ .Values.portal.replicas }}
  strategy:
    type: RollingUpdate      # R5=A
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.portal.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.portal.name }}
    spec:
      serviceAccountName: {{ .Values.podRunner.serviceAccount }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: portal
          image: {{ include "aiways-on.image" (dict "repository" .Values.portal.repository "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.portal.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          env:
            # 평문 금지 — 전부 secretKeyRef 로 주입한다 (NFR-10)
            - name: SDLC_MASTER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: master-key } }
            - name: POD_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: pod-auth-token } }
            - name: SDLC_MEMORY_TOKEN_ISSUER_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: memory-token-issuer-token } }
            - name: SDLC_RECONCILE_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: reconcile-token } }
            - name: SDLC_IMAGE_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: image-signing-secret } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: database-url } }
            - name: AUTH_GITHUB_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: auth-github-id } }
            - name: AUTH_GITHUB_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: auth-github-secret } }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: auth-secret } }
            # ⚠️ slack-app-token 은 주입하지 않는다 — Portal 은 WebSocket 을 열지 않는다.
            - name: SDLC_ENDPOINTS_MEMORY_MCP_URL
              valueFrom: { configMapKeyRef: { name: sdlc-endpoints, key: memoryMcpUrl } }
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
          # RESILIENCY-06 — 헬스체크
          readinessProbe:
            httpGet: { path: /api/health, port: {{ .Values.portal.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: {{ .Values.portal.port }} }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.portal.name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.portal.name }}
  ports:
    - port: {{ .Values.portal.port }}
      targetPort: {{ .Values.portal.port }}
