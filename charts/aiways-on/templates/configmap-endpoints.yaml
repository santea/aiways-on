# AD-5 · B-7 — 3자(U1·U3·U6) 합의점.
#
# U1: 이 키를 정의하고 MCP Service 를 배포한다.
# U3: Pod spec 에서 이 키를 참조해 `mcp_servers` 를 주입한다.
# U6: 이 Service DNS 로 :58002 를 서빙한다.
#
# 합의 지점을 키 **하나**로 좁혀 세 유닛이 각자 주소를 하드코딩하지 않게 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sdlc-endpoints
  namespace: {{ .Values.namespace }}
data:
  memoryMcpUrl: "http://{{ .Values.memoryMcp.name }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.memoryMcp.port }}"
  portalUrl: "http://{{ .Values.portal.name }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.portal.port }}"
  n8nUrl: "http://{{ .Values.n8n.name }}.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.n8n.port }}"
